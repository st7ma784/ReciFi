name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: ruby/setup-ruby@v1
        with:
          # 3.4 dropped stdlib gems that Jekyll 4.3 still expects.
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build with Jekyll
        working-directory: docs
        env:
          JEKYLL_ENV: production
        # base_path comes from the Pages config, so the site keeps working if
        # the repository is renamed.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      # No post-build grep for "{{" here: the docs deliberately show ReciFi's
      # own placeholder syntax, so the correct output contains it. The
      # source-level guard in tests.yml is what catches an unwrapped one.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
