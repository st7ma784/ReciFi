title: ReciFi
description: A label print server that runs entirely on a Raspberry Pi Pico 2 W.
# Pinned in the Gemfile rather than fetched as a remote theme -- the site is
# built by our own Actions workflow, so it need not be one of the themes
# GitHub's own Pages builder supports.
theme: just-the-docs

# baseurl is overridden at build time by actions/configure-pages, so it stays
# correct even if the repository is renamed. These are the local-preview values.
url: https://st7ma784.github.io
baseurl: /ReciFi

color_scheme: dark
search_enabled: true

aux_links:
  "View on GitHub":
    - "https://github.com/st7ma784/ReciFi"
aux_links_new_tab: true

nav_external_links:
  - title: Source
    url: https://github.com/st7ma784/ReciFi

footer_content: >-
  MIT licensed. ReciFi is not affiliated with ORGBRO; the Z3 protocol notes are
  the result of independent work with hardware the author owns.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
